<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Elige pastilla: la azul lleva a mis películas favoritas y la roja a mis animes favoritos.">
    <meta property="og:type" content="website" />
    <meta property="og:title" content="La Elección | Sergio Chorques" />
    <meta property="og:description" content="Elige pastilla: la azul lleva a mis películas favoritas y la roja a mis animes favoritos." />
    <meta property="og:url" content="https://sergiochp.github.io/mi-web/matrix_pills.html" />
    <meta property="og:image" content="https://sergiochp.github.io/mi-web/images/og-portada.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sergio Chorques, estudiante de 1º DAM" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>La Elección | Sergio Chorques</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/matrix.css" />
    <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>

    <!-- Canvas para la lluvia digital -->
    <canvas id="matrix-canvas" aria-hidden="true"></canvas>

    <!-- Salida para quien no quiera elegir -->
    <nav class="matrix-nav" aria-label="Navegación">
        <a class="matrix-back" href="index.html">← Volver al inicio</a>
    </nav>

    <!-- Interfaz principal con las pastillas -->
    <main id="ui-layer">
        <h1 class="title">Elige tu destino</h1>
        <div class="hands-container">
            <!-- Pastilla Azul -> Cine -->
            <div class="pill-option">
                <button type="button" class="pill pill-blue" id="blue-pill" aria-describedby="label-cine" title="Entrar a Cine"><span class="sr-only">Pastilla azul</span></button>
                <span class="pill-label pill-label--blue" id="label-cine">CINE</span>
            </div>

            <!-- Pastilla Roja -> Anime -->
            <div class="pill-option">
                <button type="button" class="pill pill-red" id="red-pill" aria-describedby="label-anime" title="Entrar a Anime"><span class="sr-only">Pastilla roja</span></button>
                <span class="pill-label pill-label--red" id="label-anime">ANIME</span>
            </div>
        </div>
    </main>

    <!-- Capa para el desvanecimiento y texto final -->
    <div id="fade-overlay">
        <div id="final-message" role="status" aria-live="polite"></div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const fadeOverlay = document.getElementById('fade-overlay');
        const finalMessage = document.getElementById('final-message');
        
        let rainColor = '#0F0'; // Color inicial: Verde Matrix
        let isRunning = true;
        let animationId;

        // Ajustar el canvas al tamaño de la ventana
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Caracteres para la lluvia (Katakana + Latino + Números)
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+~\\/?日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ';
        const charArray = chars.split('');
        
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        // Inicializar gotas en posiciones aleatorias
        for (let x = 0; x < columns; x++) {
            drops[x] = Math.random() * canvas.height / fontSize; // Empezar distribuido aleatoriamente
        }

        // Función de dibujado principal del Matrix
        function drawMatrix() {
            if (!isRunning) return; // Si la simulación se detiene (pastilla azul)

            // Fondo negro semitransparente para crear el efecto de rastro/estela
            ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Estilo del texto
            ctx.fillStyle = rainColor;
            ctx.font = fontSize + 'px monospace';
            ctx.textAlign = 'center';

            for (let i = 0; i < drops.length; i++) {
                // Carácter aleatorio
                const text = charArray[Math.floor(Math.random() * charArray.length)];
                
                // Dibujar carácter
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // Si la gota llega al fondo y un valor aleatorio es alto, resetear a arriba
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                // Mover la gota hacia abajo
                drops[i]++;
            }

            // Eliminar el destello (bloom) para un efecto de código más nítido y apagado
            ctx.shadowBlur = 0;
        }

        // Bucle de animación
        function animate() {
            drawMatrix();
            animationId = requestAnimationFrame(animate);
        }

        
        // Función para efecto de máquina de escribir
        function typeWriterEffect(text, color, shadowColor, delay = 50) {
            finalMessage.style.color = color;
            // Destello reducido para el texto final
            finalMessage.style.textShadow = `0 0 5px ${shadowColor}`;
            finalMessage.style.opacity = '1';
            finalMessage.innerHTML = '<span id="typed-text"></span><span class="typing-cursor"></span>';
            
            const typedTextElement = document.getElementById('typed-text');
            let i = 0;
            
            function type() {
                if (i < text.length) {
                    typedTextElement.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, delay);
                } else {
                    // Quitar el cursor parpadeante después de unos segundos
                    setTimeout(() => {
                        const cursor = document.querySelector('.typing-cursor');
                        if (cursor) cursor.remove();
                    }, 3000);
                }
            }
            type();
        }

       // Pastilla Roja -> Redirección a Anime
        document.getElementById('red-pill').addEventListener('click', () => {
            rainColor = '#e83a3a';
            
            uiLayer.style.opacity = '0';
            setTimeout(() => uiLayer.style.display = 'none', 800);

            setTimeout(() => {
                typeWriterEffect("Bienvenido al mundo del anime...", "#fff", "rgba(232, 58, 58, 0.5)", 55);
            }, 900);

            // Redirección equilibrada (3.6s en total)
            setTimeout(() => {
                window.location.href = 'anime.html';
            }, 3600);
        });

        // Pastilla Azul -> Lluvia azul y Redirección a Cine
        document.getElementById('blue-pill').addEventListener('click', () => {
            // Cambiar lluvia digital a azul cian neón
            rainColor = '#38bdf8';
            
            uiLayer.style.opacity = '0';
            setTimeout(() => uiLayer.style.display = 'none', 800);

            setTimeout(() => {
                typeWriterEffect("Entrando a la sala de cine...", "#fff", "rgba(56, 189, 248, 0.5)", 55);
            }, 900);

            // Redirección manteniendo la lluvia en pantalla
            setTimeout(() => {
                window.location.href = 'cine.html';
            }, 3600);
        });

        // Iniciar en la carga
        window.onload = () => {
            // Un pequeño retraso para inicializar el canvas sin parpadeos bruscos
            setTimeout(() => {
                animate();
            }, 100);
        };
    </script>
</body>
</html>
