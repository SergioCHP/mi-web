<!DOCTYPE html>
<html lang="es" data-accent="pink" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07070a">
    <meta name="description" content="Minijuego de combate JRPG por turnos ATB: supéralo para entrar en Videojuegos.">
    <title>Combate JRPG | Sergio Chorques</title>

    <!-- Favicon SVG -->
    <link rel="icon" href="images/logo.svg" type="image/svg+xml" />

    <!-- Aplica tema/acento guardados ANTES de pintar: evita el parpadeo oscuro→claro -->
    <script>
    (function () {
        var d = document.documentElement;
        d.classList.add("js"); // hay JavaScript: se activan animaciones como .reveal
        try {
        var t = localStorage.getItem("sergio-theme");
        if (t !== "light" && t !== "dark") {
            t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        d.setAttribute("data-theme", t);
        var a = localStorage.getItem("sergio-accent");
        if (a === "pink" || a === "blue") d.setAttribute("data-accent", a);
        } catch (e) {}
    })();
    </script>

    <!-- Precarga de los sprites del combate (se pintan en el primer frame) -->
    <link rel="preload" as="image" href="assets/combat/heroe_idle.webp">
    <link rel="preload" as="image" href="assets/combat/monstruo_idle.webp">

    <link rel="stylesheet" href="css/fonts.css" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme-light.css" />
    <link rel="stylesheet" href="css/minijuego.css" />
    <link rel="stylesheet" href="css/mobile.css" />

    <!-- Motor del combate: módulos ES (requiere servidor: GitHub Pages, Live Server…) -->
    <script type="module" src="js/jrpg/main.js"></script>
</head>
<body>

    <main class="jrpg-container" id="jrpg">
        <h1 class="sr-only">Combate JRPG: supera el reto para entrar en Videojuegos</h1>
        <!-- Botones flotantes: saltar en cualquier momento y filtro CRT -->
        <div class="battle-topbar">
            <button class="btn-fx-toggle" id="btnFx" type="button" aria-pressed="true"
                    data-i18n="ui.crt" data-i18n-title="ui.crtTitle">CRT</button>
            <a class="btn-skip-battle" id="btnQuickSkip" href="juegos.html"
               data-i18n="ui.skipBattle" data-i18n-title="ui.skipTitle">Saltar ➔</a>
        </div>

        <div class="battle-message" id="battleMessage" role="status" aria-live="polite"></div>

        <!-- Cartel de inicio (y de derrota) con opción de jugar o saltar -->
        <div class="intro-overlay" id="introOverlay">
            <div class="intro-modal" role="dialog" aria-modal="true" aria-labelledby="introTitle">
                <h2 id="introTitle" data-i18n="ui.encounter">¡Encuentro!</h2>
                <p id="introText" data-i18n="ui.introText">Juega para avanzar y desbloquear el siguiente nivel.</p>
                <div class="intro-actions">
                    <button class="btn-start" id="btnStartGame" type="button" disabled data-i18n="ui.play">Jugar</button>
                    <a class="btn-skip" id="btnIntroSkip" href="juegos.html" data-i18n="ui.skip">Saltar</a>
                </div>
                <p class="intro-controls" data-i18n="ui.controls">Ratón o táctil · Teclado: ↑↓ elegir · Enter confirmar · Esc volver</p>
            </div>
        </div>

        <!-- Escenario: todo el combate se dibuja en este canvas -->
        <div class="battle-arena" id="arena" tabindex="-1">
            <canvas id="battleCanvas" role="img" data-i18n-aria="ui.canvasLabel" aria-label="Escenario del combate"></canvas>
            <p class="target-hint" id="targetHint" hidden></p>
        </div>

        <div class="battle-ui">
            <nav class="command-menu" id="cmd-menu" data-i18n-aria="ui.commands" aria-label="Comandos">
                <div class="cmd-list" id="cmdRoot" role="menu" hidden></div>
                <div class="cmd-list cmd-submenu" id="cmdSub" role="menu" hidden></div>
                <p class="cmd-idle" id="cmdIdle" data-i18n="ui.waiting">Esperando turno…</p>
            </nav>

            <div class="status-window" id="partyStatus" role="group" data-i18n-aria="ui.party" aria-label="Grupo"></div>
        </div>

        <!-- Plantilla de fila de personaje (se clona por cada héroe: 1 a 3) -->
        <template id="tplPartyRow">
            <div class="entity-status">
                <img class="status-portrait" src="assets/Heroe.webp" alt="" width="58" height="58">
                <div class="stat-info">
                    <div>
                        <div class="stat-name"><span class="js-name"></span><span class="status-chips"></span></div>
                        <div class="bar-group">
                            <div class="bar-container"><div class="bar-ghost"></div><div class="bar-fill hp-fill"></div></div>
                            <div class="bar-container"><div class="bar-fill mp-fill"></div></div>
                            <div class="stat-numbers">HP <span class="js-hp"></span> · MP <span class="js-mp"></span></div>
                        </div>
                    </div>
                    <div class="bar-group">
                        <div class="stat-numbers atb-label">ATB</div>
                        <div class="bar-container"><div class="bar-fill atb-fill"></div></div>
                        <div class="stat-numbers limit-label">LÍMITE</div>
                        <div class="bar-container bar-container--limit"><div class="bar-fill limit-fill"></div></div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- Los módulos ES no cargan con file://: aviso para quien abra el HTML con doble clic -->
    <script>
        if (location.protocol === 'file:') {
            document.getElementById('introText').textContent =
                'Abre la web con un servidor local (p. ej. Live Server): los módulos ES no funcionan con file://';
        }
    </script>

    <noscript>
        <p class="jrpg-noscript">El combate necesita JavaScript. <a href="juegos.html">Ir a Videojuegos</a></p>
    </noscript>
</body>
</html>
