<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Privado | Sergio Chorques</title>
  <style>
    :root { 
      --bg: #07080b; --surface: #0e1017; --surface-2: #141720; 
      --accent: #ff2e97; --text: #e6edf3; --muted: #838a96; 
      --line: rgba(255,255,255,0.08); 
    }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 1.5rem; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; transition: opacity 0.2s; }
    .card.leido { opacity: 0.55; }
    input, button { padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid var(--line); font-size: 0.95rem; }
    input { background: var(--surface-2); color: #fff; width: 100%; box-sizing: border-box; margin-bottom: 1rem; }
    input:focus { outline: 2px solid var(--accent); }
    button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
    .btn-secondary { background: var(--surface-2); border: 1px solid var(--line); }
    .btn-delete { background: #ef4444; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;}
    .badge { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; margin-left: 8px;}
    .meta { font-size: 0.85rem; color: var(--muted); margin: 0.3rem 0 0.8rem; }
    .actions { display: flex; gap: 0.5rem; }
    
    /* Diseño del login */
    .login-box { max-width: 360px; margin: 15vh auto; text-align: center; }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <script>
    // 1. PEGA TUS DATOS DE SUPABASE AQUÍ
    const SUPABASE_URL = "https://kusmmtgvrecayytatvbf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1c21tdGd2cmVjYXl5dGF0dmJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2Mjc3NzgsImV4cCI6MjEwNjIwMzc3OH0.y_p7oKUQPueKn8fSqWGqlRafnDaQelFX0cvFmQv3AqI";

    // 2. CONTRASEÑA PARA ENTRAR A ESTA PÁGINA
    const ADMIN_PASSWORD = "1234";

    const app = document.getElementById("app");

    // Dibuja la pantalla de login
    function renderLogin(err = false) {
      app.innerHTML = `
        <div class="card login-box">
          <h2 style="margin-top:0">Acceso Privado</h2>
          <p style="color:var(--muted); font-size:0.9rem; margin-bottom: 1.5rem;">Panel de control de mensajes</p>
          ${err ? '<p style="color:#ef4444; font-size:0.9rem">Contraseña incorrecta</p>' : ''}
          <input type="password" id="adminPass" placeholder="Introduce la contraseña" onkeypress="if(event.key === 'Enter') verificarPass()">
          <button style="width:100%" onclick="verificarPass()">Entrar al Panel</button>
        </div>
      `;
    }

    // Comprueba la contraseña
    function verificarPass() {
      const pass = document.getElementById("adminPass").value;
      if (pass === ADMIN_PASSWORD) {
        sessionStorage.setItem("admin_auth", "true"); // Guarda la sesión mientras la pestaña esté abierta
        cargarMensajes();
      } else {
        renderLogin(true);
      }
    }

    // Pide los mensajes a Supabase
    async function cargarMensajes() {
      if (!sessionStorage.getItem("admin_auth")) return renderLogin();

      app.innerHTML = '<p style="text-align:center; color:var(--muted)">Conectando con la base de datos...</p>';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/mensajes?select=*&order=fecha.desc`, {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!res.ok) throw new Error("Error de API");

        const mensajes = await res.json();
        renderDashboard(mensajes);
      } catch (error) {
        app.innerHTML = '<p style="color:#ef4444; text-align:center;">Error cargando mensajes. Comprueba tus credenciales de Supabase.</p>';
      }
    }

    // Dibuja el panel con los mensajes
    function renderDashboard(mensajes) {
      let html = `
        <div class="top-bar">
          <h2 style="margin:0">Mensajes recibidos (${mensajes.length})</h2>
          <div style="display: flex; gap: 10px;">
            <button class="btn-secondary" onclick="cargarMensajes()">Actualizar</button>
            <button class="btn-delete" onclick="cerrarSesion()">Cerrar sesión</button>
          </div>
        </div>
      `;

      if (mensajes.length === 0) {
        html += '<div class="card"><p style="margin:0; color:var(--muted)">Bandeja de entrada vacía.</p></div>';
      }

      mensajes.forEach(m => {
        const fecha = new Date(m.fecha).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
        html += `
          <div class="card ${m.leido ? 'leido' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap: wrap; gap: 10px;">
              <div>
                <strong style="font-size: 1.1rem;">${m.nombre}</strong>
                ${m.disponibilidad ? `<span class="badge">${m.disponibilidad}</span>` : ''}
                <div class="meta">${m.email} &bull; ${m.telefono || 'Sin teléfono'} &bull; ${fecha}</div>
              </div>
              <div class="actions">
                <button class="btn-secondary" onclick="toggleLeido(${m.id}, ${m.leido})">${m.leido ? 'Marcar como pendiente' : 'Marcar como leído'}</button>
                <button class="btn-delete" onclick="borrarMensaje(${m.id})">Borrar</button>
              </div>
            </div>
            <p style="margin:0.5rem 0 0; line-height:1.5; background: var(--surface-2); padding: 10px; border-radius: 6px;">
              ${m.mensaje || '<i style="color:var(--muted)">El usuario no dejó ningún mensaje adicional.</i>'}
            </p>
          </div>
        `;
      });

      app.innerHTML = html;
    }

    // Actualiza el estado (leído/no leído) en Supabase
    async function toggleLeido(id, estadoActual) {
      await fetch(`${SUPABASE_URL}/rest/v1/mensajes?id=eq.${id}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ leido: !estadoActual })
      });
      cargarMensajes();
    }

    // Borra el mensaje de Supabase
    async function borrarMensaje(id) {
      if (!confirm("¿Eliminar este mensaje permanentemente?")) return;
      await fetch(`${SUPABASE_URL}/rest/v1/mensajes?id=eq.${id}`, {
        method: "DELETE",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
        }
      });
      cargarMensajes();
    }

    function cerrarSesion() {
      sessionStorage.removeItem("admin_auth");
      renderLogin();
    }

    // Iniciar: si ya hay sesión, carga mensajes; si no, muestra login.
    sessionStorage.getItem("admin_auth") ? cargarMensajes() : renderLogin();
  </script>
</body>
</html>
